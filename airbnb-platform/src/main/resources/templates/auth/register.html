<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inregistrare - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <section class="py-5 min-vh-100 d-flex align-items-center bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-5">
                            <h3 class="card-title text-center mb-4">
                                <i class="fas fa-user-plus text-danger"></i> Creeaza-ti contul
                            </h3>
                            <form method="POST" th:action="@{/auth/register}" th:object="${user}" class="needs-validation">
                                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                                    <i class="fas fa-exclamation-circle"></i> Verifica datele introduse.
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">Prenume</label>
                                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" th:errorclass="is-invalid" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Nume</label>
                                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" th:errorclass="is-invalid" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Adresa de email</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    <small class="form-text text-muted">Nu vom distribui niciodata emailul tau.</small>
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Numar de telefon</label>
                                    <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                                </div>

                                <div class="mb-3">
                                    <label for="role" class="form-label">Tip cont</label>
                                    <select class="form-select" id="role" th:field="*{role}">
                                        <option value="GUEST">Oaspete - vreau sa rezerv</option>
                                        <option value="HOST">Gazda - vreau sa ofer cazare</option>
                                    </select>
                                </div>


                                <div class="mb-3">
                                    <label for="password" class="form-label">Parola</label>
                                    <input type="password" class="form-control" id="password" name="password" minlength="8" required th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                    <small class="form-text text-muted">Minimum 8 caractere.</small>
                                </div>

                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirma parola</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="agree" required>
                                    <label class="form-check-label" for="agree">
                                        Sunt de acord cu Termenii si conditiile si Politica de confidentialitate
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-danger w-100 btn-lg">
                                    <i class="fas fa-user-plus"></i> Inregistrare
                                </button>
                            </form>

                            <hr class="my-4">

                            <p class="text-center mb-0">
                                Ai deja un cont? <a href="/auth/login" th:href="@{/auth/login}" class="text-danger fw-bold">Autentifica-te aici</a>
                            </p>

                            <p class="text-center mt-3">
                                <a href="/" th:href="@{/}" class="text-muted">Inapoi la pagina principala</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
