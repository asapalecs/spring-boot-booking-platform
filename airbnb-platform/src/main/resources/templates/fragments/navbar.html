<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="navbar" class="navbar">
    <div class="container">
        <h1><a href="/">Platforma Airbnb</a></h1>
        <ul>
            <li><a href="/">Acasa</a></li>
            <li><a href="/properties">Proprietati</a></li>
            <li><a href="/reservations">Rezervari</a></li>
            <li sec:authorize="isAnonymous()"><a href="/auth/login">Autentificare</a></li>
            <li sec:authorize="isAnonymous()"><a href="/auth/register">Inregistrare</a></li>
            <li sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
            </li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/auth/logout}" method="post" style="display:inline;">
                    <button type="submit">Deconectare</button>
                </form>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
