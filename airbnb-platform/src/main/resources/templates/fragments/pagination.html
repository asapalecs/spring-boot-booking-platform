<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
</head>
<body>

<nav th:fragment="pagination" aria-label="Navigare pagini" th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
            <a class="page-link" href="#" th:href="@{${url}(page=0)}" th:if="${!page.first}">Prima</a>
            <span class="page-link" th:if="${page.first}">Prima</span>
        </li>

        <li class="page-item" th:classappend="${!page.hasPrevious() ? 'disabled' : ''}">
            <a class="page-link" href="#" th:href="@{${url}(page=${page.number - 1})}" th:if="${page.hasPrevious()}">Anterioara</a>
            <span class="page-link" th:if="${!page.hasPrevious()}">Anterioara</span>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${page.number == i ? 'active' : ''}">
            <a class="page-link" href="#" th:href="@{${url}(page=${i})}" th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${!page.hasNext() ? 'disabled' : ''}">
            <a class="page-link" href="#" th:href="@{${url}(page=${page.number + 1})}" th:if="${page.hasNext()}">Urmatoarea</a>
            <span class="page-link" th:if="${!page.hasNext()}">Urmatoarea</span>
        </li>

        <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
            <a class="page-link" href="#" th:href="@{${url}(page=${page.totalPages - 1})}" th:if="${!page.last}">Ultima</a>
            <span class="page-link" th:if="${page.last}">Ultima</span>
        </li>
    </ul>
</nav>

<div th:fragment="pageInfo" class="text-center text-muted mb-3">
    <p>Pagina <span th:text="${page.number + 1}">1</span> din <span th:text="${page.totalPages}">1</span>
       (<span th:text="${page.totalElements}">0</span> elemente in total)</p>
</div>

</body>
</html>
