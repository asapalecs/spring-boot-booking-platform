<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular proprietate - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-home"></i>
                                <span th:if="${property.id == null}">Adauga proprietate noua</span>
                                <span th:unless="${property.id == null}">Editeaza proprietatea</span>
                            </h4>
                        </div>
                        <div class="card-body p-5">
                            <form method="POST" th:object="${property}" class="needs-validation"
                                  th:action="${property.id == null} ? @{/properties} : @{/properties/{id}(id=${property.id})}">
                                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                                    <div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div>
                                </div>
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{hostId}">

                                <fieldset class="mb-4">
                                    <legend class="fs-5 fw-bold mb-3">Informatii de baza</legend>

                                    <div class="mb-3">
                                        <label for="name" class="form-label">Nume proprietate *</label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="description" class="form-label">Descriere *</label>
                                        <textarea class="form-control" id="description" th:field="*{description}" th:errorclass="is-invalid" rows="4" required></textarea>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="propertyType" class="form-label">Tip proprietate *</label>
                                        <select class="form-select" id="propertyType" th:field="*{propertyType}" th:errorclass="is-invalid" required>
                                            <option value="">Alege tipul</option>
                                            <option value="Apartment">Apartament</option>
                                            <option value="House">Casa</option>
                                            <option value="Villa">Vila</option>
                                            <option value="Condo">Apartament in condominiu</option>
                                            <option value="Townhouse">Casa insiruita</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('propertyType')}" th:errors="*{propertyType}"></div>
                                    </div>
                                </fieldset>

                                <fieldset class="mb-4">
                                    <legend class="fs-5 fw-bold mb-3">Locatie</legend>

                                    <div class="mb-3">
                                        <label for="address" class="form-label">Adresa *</label>
                                        <input type="text" class="form-control" id="address" th:field="*{address}" th:errorclass="is-invalid" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="city" class="form-label">Oras *</label>
                                            <input type="text" class="form-control" id="city" th:field="*{city}" th:errorclass="is-invalid" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="country" class="form-label">Tara *</label>
                                            <input type="text" class="form-control" id="country" th:field="*{country}" th:errorclass="is-invalid" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></div>
                                        </div>
                                    </div>

                                </fieldset>

                                <fieldset class="mb-4">
                                    <legend class="fs-5 fw-bold mb-3">Pret si capacitate</legend>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="pricePerNight" class="form-label">Pret pe noapte ($) *</label>
                                            <input type="number" class="form-control" id="pricePerNight" th:field="*{pricePerNight}" th:errorclass="is-invalid" step="0.01" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="maxGuests" class="form-label">Numar maxim de oaspeti *</label>
                                            <input type="number" class="form-control" id="maxGuests" th:field="*{maxGuests}" th:errorclass="is-invalid" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maxGuests')}" th:errors="*{maxGuests}"></div>
                                        </div>
                                    </div>
                                </fieldset>

                                <fieldset class="mb-4">
                                    <legend class="fs-5 fw-bold mb-3">Facilitati</legend>
                                    <input type="hidden" name="_amenityIds" value="on">
                                    <div class="row" th:if="${availableAmenities != null}">
                                        <div th:each="amenity : ${availableAmenities}" class="col-md-6 mb-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" th:value="${amenity.id}" th:id="${'amenity-' + amenity.id}" name="amenityIds"
                                                       th:checked="${property.amenityIds != null and property.amenityIds.contains(amenity.id)}">
                                                <label class="form-check-label" th:for="${'amenity-' + amenity.id}" th:text="${amenity.name}">Facilitate</label>
                                            </div>
                                        </div>
                                    </div>
                                </fieldset>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg flex-grow-1">
                                        <i class="fas fa-save"></i> Salveaza proprietatea
                                    </button>
                                    <a href="/properties" th:href="@{/properties}" class="btn btn-secondary btn-lg">
                                        <i class="fas fa-times"></i> Anuleaza
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
