<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plati - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5">
        <div class="container">
            <h2 class="mb-4"><i class="fas fa-credit-card text-danger"></i> Plati</h2>

            <div th:if="${payments.isEmpty()}" class="alert alert-info">
                <i class="fas fa-info-circle"></i> Nu exista inca plati.
            </div>

            <div class="table-responsive" th:unless="${payments.isEmpty()}">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Rezervare</th>
                            <th>Oaspete</th>
                            <th>Suma</th>
                            <th>Metoda</th>
                            <th>Status</th>
                            <th>Data</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${payments}">
                            <td th:text="${p.id}">1</td>
                            <td><a th:href="@{/reservations/{id}(id=${p.reservation.id})}" th:text="'#' + ${p.reservation.id}">#1</a></td>
                            <td th:text="${p.reservation.guest.firstName + ' ' + p.reservation.guest.lastName}">Oaspete</td>
                            <td th:text="'$' + ${p.amount}">$300</td>
                            <td th:text="${p.paymentMethod == 'CREDIT_CARD' ? 'Card de credit' : (p.paymentMethod == 'DEBIT_CARD' ? 'Card de debit' : (p.paymentMethod == 'PAYPAL' ? 'PayPal' : (p.paymentMethod == 'BANK_TRANSFER' ? 'Transfer bancar' : p.paymentMethod)))}">Card de credit</td>
                            <td><span class="badge" th:classappend="${p.status == 'COMPLETED' ? 'bg-success' : (p.status == 'PENDING' ? 'bg-warning text-dark' : 'bg-secondary')}" th:text="${p.status == 'COMPLETED' ? 'Finalizata' : (p.status == 'PENDING' ? 'In asteptare' : (p.status == 'REFUNDED' ? 'Rambursata' : (p.status == 'CANCELLED' ? 'Anulata' : p.status)))}">Finalizata</span></td>
                            <td th:text="${p.paymentDate != null ? #temporals.format(p.paymentDate, 'dd.MM.yyyy HH:mm') : '-'}">Data</td>
                            <td><a th:href="@{/payments/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Vezi</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
