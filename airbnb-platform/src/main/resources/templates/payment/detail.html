<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalii plata - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow-lg border-0" th:with="p=${payment}">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-credit-card"></i> Detalii plata</h4>
                        </div>
                        <div class="card-body p-5">
                            <div class="mb-4">
                                <p class="text-muted mb-1">ID tranzactie</p>
                                <h6 class="text-break" th:text="${p.transactionId}">TXN123456</h6>
                            </div>

                            <div class="row mb-4">
                                <div class="col-6">
                                    <p class="text-muted mb-1">Suma</p>
                                    <h5 th:text="'$' + ${p.amount}">$300</h5>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">Status</p>
                                    <span class="badge" th:classappend="${p.status == 'COMPLETED' ? 'bg-success' : (p.status == 'PENDING' ? 'bg-warning text-dark' : 'bg-secondary')}" th:text="${p.status == 'COMPLETED' ? 'Finalizata' : (p.status == 'PENDING' ? 'In asteptare' : (p.status == 'REFUNDED' ? 'Rambursata' : (p.status == 'CANCELLED' ? 'Anulata' : p.status)))}">Finalizata</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <p class="text-muted mb-1">Metoda de plata</p>
                                <p th:text="${p.paymentMethod == 'CREDIT_CARD' ? 'Card de credit' : (p.paymentMethod == 'DEBIT_CARD' ? 'Card de debit' : (p.paymentMethod == 'PAYPAL' ? 'PayPal' : (p.paymentMethod == 'BANK_TRANSFER' ? 'Transfer bancar' : p.paymentMethod)))}">Card de credit</p>
                            </div>

                            <div class="mb-4" th:if="${p.paymentDate != null}">
                                <p class="text-muted mb-1">Data</p>
                                <p th:text="${#temporals.format(p.paymentDate, 'dd.MM.yyyy HH:mm')}">Data</p>
                            </div>

                            <div class="alert alert-info" th:if="${p.status == 'COMPLETED'}">
                                <i class="fas fa-info-circle"></i> Plata a fost primita cu succes. Rezervarea ta este confirmata.
                            </div>

                            <div class="d-grid gap-2">
                                <a th:href="@{/reservations/{id}(id=${p.reservation.id})}" class="btn btn-outline-danger">
                                    <i class="fas fa-file-alt"></i> Vezi rezervarea
                                </a>
                                <a th:href="@{/reservations}" class="btn btn-danger">
                                    <i class="fas fa-calendar-check"></i> Vezi rezervarile
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
