<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plata - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-credit-card"></i> Plata rezervarii</h4>
                        </div>
                        <div class="card-body p-5">
                            <div class="mb-4">
                                <p class="text-muted mb-1">Proprietate</p>
                                <h5 th:text="${reservation.property.name}">Proprietate</h5>
                                <p class="mb-0">
                                    <span th:text="${#temporals.format(reservation.checkInDate, 'dd.MM.yyyy')}">01.01.2026</span>
                                    &rarr;
                                    <span th:text="${#temporals.format(reservation.checkOutDate, 'dd.MM.yyyy')}">05.01.2026</span>
                                    &middot; <span th:text="${reservation.numberOfGuests} + ' oaspeti'">2 oaspeti</span>
                                </p>
                            </div>

                            <div class="alert alert-light border d-flex justify-content-between align-items-center">
                                <span>Suma de plata</span>
                                <strong class="fs-4 text-danger" th:text="'$' + ${payment.amount}">$300</strong>
                            </div>

                            <form method="POST" th:action="@{/payments}" th:object="${payment}">
                                <input type="hidden" th:field="*{reservationId}">

                                <div class="mb-4">
                                    <label for="paymentMethod" class="form-label">Metoda de plata *</label>
                                    <select class="form-select" id="paymentMethod" th:field="*{paymentMethod}" required>
                                        <option value="CREDIT_CARD">Card de credit</option>
                                        <option value="DEBIT_CARD">Card de debit</option>
                                        <option value="PAYPAL">PayPal</option>
                                        <option value="BANK_TRANSFER">Transfer bancar</option>
                                    </select>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg">
                                        <i class="fas fa-lock"></i> Plateste acum
                                    </button>
                                    <a th:href="@{/reservations/{id}(id=${reservation.id})}" class="btn btn-secondary">Anuleaza</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
