<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recenzie - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-star"></i> Recenzie</h4>
                            <small th:text="${review.property.name}">Proprietate</small>
                        </div>
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between mb-2">
                                <strong th:text="${review.user.firstName + ' ' + review.user.lastName}">Autor</strong>
                                <span class="text-warning" th:text="'★ ' + ${review.rating} + '/5'">★ 5/5</span>
                            </div>
                            <p class="text-muted small" th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">Data</p>
                            <p th:text="${review.comment}">Comentariu</p>
                            <a th:href="@{/properties/{pid}/reviews(pid=${propertyId})}" class="btn btn-secondary w-100 mt-3">
                                <i class="fas fa-arrow-left"></i> Inapoi la recenzii
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
