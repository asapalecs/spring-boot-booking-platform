<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular camera - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-door-open"></i> <span th:text="${room.id == null ? 'Camera noua' : 'Editeaza camera'}">Formular camera</span></h4>
                        </div>
                        <div class="card-body p-5">
                            <form method="POST" th:object="${room}"
                                  th:action="${room.id == null} ? @{/properties/{pid}/rooms(pid=${propertyId})} : @{/properties/{pid}/rooms/{id}(pid=${propertyId},id=${room.id})}">
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{propertyId}">

                                <div class="mb-3">
                                    <label for="roomNumber" class="form-label">Nume / numar camera *</label>
                                    <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}" th:errorclass="is-invalid" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="roomType" class="form-label">Tip camera *</label>
                                    <select class="form-select" id="roomType" th:field="*{roomType}" th:errorclass="is-invalid" required>
                                        <option value="">Alege tipul</option>
                                        <option value="SINGLE">Single</option>
                                        <option value="DOUBLE">Dubla</option>
                                        <option value="SUITE">Suita</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="capacity" class="form-label">Capacitate *</label>
                                        <input type="number" class="form-control" id="capacity" th:field="*{capacity}" th:errorclass="is-invalid" min="1" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="price" class="form-label">Pret pe noapte ($)</label>
                                        <input type="number" class="form-control" id="price" th:field="*{price}" th:errorclass="is-invalid" min="0.01" step="0.01">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                    </div>
                                </div>

                                <div class="mb-4 form-check">
                                    <input type="checkbox" class="form-check-input" id="available" th:field="*{available}">
                                    <label class="form-check-label" for="available">Disponibila</label>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg">Salveaza camera</button>
                                    <a th:href="@{/properties/{pid}/rooms(pid=${propertyId})}" class="btn btn-secondary">Anuleaza</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
