<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizatori - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5">
        <div class="container">
            <h2 class="mb-4"><i class="fas fa-users text-danger"></i> Gestionare utilizatori</h2>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Nume</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Creat</th>
                            <th>Actiuni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users.content}">
                            <td>
                                <strong th:text="${user.firstName + ' ' + user.lastName}">Nume</strong>
                            </td>
                            <td th:text="${user.email}">email@example.com</td>
                            <td>
                                <span class="badge bg-primary" th:text="${user.role}">GUEST</span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">Data</td>
                            <td>
                                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">Vezi</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${users.totalPages > 1}" aria-label="Navigare pagini">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}">
                        <a class="page-link" href="#" th:href="@{/users(page=0)}" th:if="${!users.first}">Prima</a>
                        <span class="page-link" th:if="${users.first}">Prima</span>
                    </li>
                    <li class="page-item" th:classappend="${!users.hasPrevious() ? 'disabled' : ''}">
                        <a class="page-link" href="#" th:href="@{/users(page=${users.number - 1})}" th:if="${users.hasPrevious()}">Anterioara</a>
                        <span class="page-link" th:if="${!users.hasPrevious()}">Anterioara</span>
                    </li>
                    <li class="page-item active" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                        <a class="page-link" href="#" th:href="@{/users(page=${i})}" th:text="${i + 1}" th:classappend="${users.number == i ? 'active' : ''}"></a>
                    </li>
                    <li class="page-item" th:classappend="${!users.hasNext() ? 'disabled' : ''}">
                        <a class="page-link" href="#" th:href="@{/users(page=${users.number + 1})}" th:if="${users.hasNext()}">Urmatoarea</a>
                        <span class="page-link" th:if="${!users.hasNext()}">Urmatoarea</span>
                    </li>
                    <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}">
                        <a class="page-link" href="#" th:href="@{/users(page=${users.totalPages - 1})}" th:if="${!users.last}">Ultima</a>
                        <span class="page-link" th:if="${users.last}">Ultima</span>
                    </li>
                </ul>
            </nav>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
