<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil utilizator - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0 mb-4">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-user"></i> Profil utilizator</h4>
                        </div>
                        <div class="card-body p-5">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <p><strong>Prenume:</strong></p>
                                    <p th:text="${user.firstName}">Prenume</p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Nume:</strong></p>
                                    <p th:text="${user.lastName}">Nume</p>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <p><strong>Email:</strong></p>
                                    <p th:text="${user.email}">email@example.com</p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Telefon:</strong></p>
                                    <p th:text="${user.phoneNumber}">Telefon</p>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <p><strong>Rol:</strong></p>
                                    <p><span class="badge bg-primary" th:text="${user.role}">GUEST</span></p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Creat:</strong></p>
                                    <p th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">Data</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-lg border-0 mb-4" th:if="${userProperties != null && userProperties.size() > 0}">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0"><i class="fas fa-home"></i> Proprietati</h5>
                        </div>
                        <div class="card-body">
                            <div th:each="property : ${userProperties}" class="mb-3 pb-3 border-bottom">
                                <h6 th:text="${property.name}">Nume proprietate</h6>
                                <p class="text-muted small mb-0" th:text="${property.city + ', ' + property.country}">Locatie</p>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-lg border-0" th:if="${userReservations != null && userReservations.size() > 0}">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0"><i class="fas fa-calendar-check"></i> Rezervari</h5>
                        </div>
                        <div class="card-body">
                            <div th:each="reservation : ${userReservations}" class="mb-3 pb-3 border-bottom">
                                <h6 th:text="${reservation.property.name}">Nume proprietate</h6>
                                <p class="text-muted small mb-1">
                                    <i class="fas fa-calendar"></i>
                                    <span th:text="${#temporals.format(reservation.checkInDate, 'dd.MM.yyyy')} + ' - ' + ${#temporals.format(reservation.checkOutDate, 'dd.MM.yyyy')}">Perioada</span>
                                </p>
                                <p class="text-muted small mb-0">
                                    <span class="badge" th:classappend="'bg-' + ${reservation.status == 'CONFIRMED' ? 'success' : 'warning'}" th:text="${reservation.status}">Status</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
