<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular utilizator - AirbnbHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="mb-0"><i class="fas fa-user"></i> Formular utilizator</h4>
                        </div>
                        <div class="card-body p-5">
                            <form method="POST" th:object="${user}"
                                  th:action="${user.id == null} ? @{/users} : @{/users/{id}(id=${user.id})}">
                                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                                    <div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div>
                                </div>
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label for="firstName" class="form-label">Prenume *</label>
                                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" th:errorclass="is-invalid" required>
                                </div>

                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Nume *</label>
                                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" th:errorclass="is-invalid" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid" required>
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Telefon</label>
                                    <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" th:errorclass="is-invalid">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label" th:text="${user.id == null ? 'Parola *' : 'Parola noua (optional)'}">Parola</label>
                                    <input type="password" class="form-control" id="password" name="password" minlength="8" th:required="${user.id == null}"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                </div>


                                <div class="mb-3">
                                    <label for="role" class="form-label">Rol *</label>
                                    <select class="form-select" id="role" th:field="*{role}" th:errorclass="is-invalid" required>
                                        <option value="">Alege rolul</option>
                                        <option value="GUEST">Oaspete</option>
                                        <option value="HOST">Gazda</option>
                                        <option value="ADMIN">Administrator</option>
                                    </select>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg">Salveaza utilizatorul</button>
                                    <a href="/users" th:href="@{/users}" class="btn btn-secondary">Anuleaza</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
