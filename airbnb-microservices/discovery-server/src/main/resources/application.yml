spring:
  application:
    name: discovery-server
  cloud:
    config:
      enabled: false

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
