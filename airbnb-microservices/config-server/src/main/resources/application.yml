spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: file:${user.dir}/../config-repo
        git:
          enabled: false
  profiles:
    active: native

server:
  port: 8888

eureka:
  client:
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    preferIpAddress: false

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
