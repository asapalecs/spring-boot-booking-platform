spring:
  application:
    name: review-service
  datasource:
    url: jdbc:h2:mem:reviewdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

server:
  port: 8084

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
