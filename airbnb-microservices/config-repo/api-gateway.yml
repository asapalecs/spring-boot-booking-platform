spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/user-fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/api/properties/**
          filters:
            - name: CircuitBreaker
              args:
                name: property-service
                fallbackUri: forward:/property-fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
          filters:
            - name: CircuitBreaker
              args:
                name: booking-service
                fallbackUri: forward:/booking-fallback
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
          filters:
            - name: CircuitBreaker
              args:
                name: review-service
                fallbackUri: forward:/review-fallback

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

jwt:
  secret: ${JWT_SECRET:local-development-only-do-not-use-in-any-shared-environment}

server:
  port: 8080

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
